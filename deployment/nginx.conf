server {
    listen 80;
    listen [::]:80;
    server_name memoriko.com www.memoriko.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/memoriko/acme; }
    location / { return 301 https://memoriko.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.memoriko.com;
    ssl_certificate /etc/letsencrypt/live/memoriko.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memoriko.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://memoriko.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name memoriko.com;
    ssl_certificate /etc/letsencrypt/live/memoriko.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memoriko.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/memoriko/current;
    index index.html;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location ^~ /api/ {
        if (-f /etc/memoriko/maintenance) { return 503; }
        proxy_pass http://127.0.0.1:5567;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }
    location = /api { return 404; }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
