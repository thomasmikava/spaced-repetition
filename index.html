<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Memoriko has moved</title></head><body><p>Memoriko has moved to <a href="https://memoriko.com">memoriko.com</a>.</p><script>function memorikoTarget(href) {
  const url = new URL(href);
  let route = url.pathname.replace(/^\/spaced-repetition(?=\/|$)/, '') || '/';
  let query = url.search;
  if (query.startsWith('?/')) {
    const decoded = query.slice(1).split('&').map(s => s.replace(/~and~/g, '&')).join('?');
    const split = decoded.indexOf('?');
    route = split === -1 ? decoded : decoded.slice(0, split);
    query = split === -1 ? '' : decoded.slice(split);
  }
  return 'https://memoriko.com' + (route.startsWith('/') ? route : '/' + route) + query + url.hash;
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/spaced-repetition/sw.js').catch(()=>{});
location.replace(memorikoTarget(location.href));</script></body></html>
